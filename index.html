<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF</title>
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#C8102E;--bgDark:#7A0A1C;--card:#fff;--text:#292526;--accent:#FFD23F}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#fff;background-color:#211e20;
 background-image:repeating-linear-gradient(135deg,transparent 0 34px,rgba(255,255,255,.018) 34px 35px),linear-gradient(155deg,#c8102e 0%,#8b1028 34%,#49202a 64%,#211e20 100%);
 background-attachment:fixed;padding:max(22px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
body.hasbg{background-image:none;background-color:#211e20}
body.hasbg::before{content:"";position:fixed;inset:-10px;background-image:var(--page-background-image);background-size:cover;background-position:center;filter:blur(7px);transform:scale(1.02);z-index:0;pointer-events:none}
body.hasbg::after{content:"";position:fixed;inset:0;background:linear-gradient(155deg,rgba(92,12,30,.38),rgba(23,21,22,.7));z-index:0;pointer-events:none}
main{position:relative;z-index:1;width:100%;max-width:1040px;margin:0 auto}
.lang{display:flex;justify-content:flex-end;margin-bottom:8px}
.lang button{font:inherit;font-weight:700;background:rgba(35,22,25,.3);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px 16px;cursor:pointer;transition:background .18s,border-color .18s}
.lang button:hover{background:rgba(255,255,255,.14);border-color:#fff}
.lang button:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{text-align:center;margin:10px 0 32px}
.logo{display:inline-block;height:146px;overflow:hidden;background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:10px 18px 0;box-shadow:0 12px 34px rgba(28,8,13,.24)}
.logo img{display:block;width:200px;max-width:62vw;height:auto}
.about{margin-top:20px;font-size:27px;font-weight:800;line-height:1.16;text-shadow:0 2px 18px rgba(30,8,14,.2)}
.about small{display:block;font-size:16px;font-weight:500;opacity:.86;margin-top:5px}
h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:28px 3px 12px;color:#fff}
h2::before{content:"";width:4px;height:20px;border-radius:4px;background:var(--accent);box-shadow:0 0 14px rgba(255,210,63,.3)}
.link-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.link{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;background:rgba(255,255,255,.97);color:var(--text);text-decoration:none;border:1px solid rgba(255,255,255,.75);border-radius:15px;padding:12px 14px;margin-bottom:10px;box-shadow:0 5px 16px rgba(20,8,12,.13);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.link-grid .link{margin-bottom:0;min-width:0}
.link:hover,.link:active{transform:translateY(-2px);background:#fff;box-shadow:0 10px 24px rgba(20,8,12,.2)}
.link.branch{display:block;padding:0;overflow:hidden;background:#fff}
.branch-photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center 48%;background:#e8e4e2}
.branch-info{display:flex;align-items:center;gap:14px;padding:11px 14px}
.ico{flex:none;width:46px;height:46px;border-radius:13px;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ico.web{background:#fff;border:1px solid #c8102e;border-radius:50%}
.ico.web svg{stroke:#c8102e}
.ico.instagram{background:linear-gradient(145deg,#feda75 0%,#fa7e1e 24%,#d62976 58%,#962fbf 78%,#4f5bd5 100%);border-radius:14px}
.ico.tiktok{background:#111116}
.ico.tiktok svg{filter:drop-shadow(-1.5px 0 #25f4ee) drop-shadow(1.5px 0 #fe2c55)}
.ico.whatsapp{background:#25a85a;border-radius:50%}
.ico.location{background:#e8f4ed;border:1px solid rgba(36,122,90,.24);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.ico.location svg{stroke:#a30e25;filter:drop-shadow(0 1px 1px rgba(25,65,45,.22))}
.ico.location svg .pin{fill:#c8102e;stroke:#a30e25;stroke-width:1}
.ico.location svg .pin-hole{fill:#fff;stroke:#fff;stroke-width:1}
.ico.app{position:relative;background:#fff;overflow:hidden}
.ico.app img{position:absolute;top:-8.7%;left:50%;display:block;width:163%;max-width:none;height:auto;transform:translateX(-50%)}
.ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:#fff;stroke:none}
.txt{flex:1;min-width:0;line-height:1.15}
.txt b{display:block;font-size:18px;font-weight:800}
.txt span{font-size:14px;opacity:.68;font-weight:500}
.go{flex:none;width:9px;height:9px;border:solid var(--text);border-width:0 0 2px 2px;transform:rotate(45deg);opacity:.42;transition:transform .18s,opacity .18s}
.link:hover .go{opacity:.8;transform:translateX(-2px) rotate(45deg)}
[dir=ltr] .go{transform:rotate(-135deg)}
footer{text-align:center;margin-top:30px;font-size:13px;opacity:.68}
@media (min-width:640px){.link-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:920px){.link-grid.branches{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:380px){body{padding-left:14px;padding-right:14px}.hero{margin-bottom:27px}.link{gap:11px;padding:11px 12px}.ico{width:43px;height:43px}.txt b{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.logo{animation:arrive .55s ease-out both}.link{animation:arrive .45s ease-out both}.link:nth-of-type(2){animation-delay:.04s}.link:nth-of-type(3){animation-delay:.08s}@keyframes arrive{from{transform:translateY(9px);opacity:0}to{transform:translateY(0);opacity:1}}}
</style>
</head>
<body>
<main>
 <div class="lang"><button id="lang" type="button" aria-label="Language">EN</button></div>
 <section class="hero">
  <div class="logo"><img id="logo" alt="MF"></div>
  <p class="about" id="about"></p>
 </section>
 <div id="sections"></div>
 <footer id="foot"></footer>
</main>
<script src="config.js"></script>
<script>
const I={
instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="f" cx="17.2" cy="6.8" r="1.2"/>',
tiktok:'<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.6 2 4.3 5 4.5"/>',
whatsapp:'<path d="M3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 8 19.2l-4.5 1.3z"/><path d="M9 8.5c0 3.3 2.7 6 6 6l1.2-1.4-2-1-1 .8c-.8-.4-1.5-1.1-1.9-1.9l.8-1-1-2L9 8.5z"/>',
web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
app:'<path d="M8 17.5 14.5 6l5.5 11.5M4 17.5h16M7.2 12h9.6"/>',
map:'<path class="pin" d="M12 22s-8-7.3-8-13a8 8 0 1 1 16 0c0 5.7-8 13-8 13z"/><circle class="pin-hole" cx="12" cy="9" r="3"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
facebook:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>',
email:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>'};
const S=window.SITE,$=id=>document.getElementById(id);
let L=localStorage.getItem('mf-lang')||'ar';
const t=o=>typeof o==='string'?o:(o[L]||o.ar||'');
function renderLink(l){
 const icon=l.type==='app'?'<span class="ico app"><img src="'+S.logo+'" alt=""></span>':'<span class="ico '+l.type+(l.type==='map'?' location':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+(I[l.type]||I.web)+'</svg></span>';
 const text='<span class="txt"><b>'+t(l.title)+'</b>'+(l.sub?'<span>'+t(l.sub)+'</span>':'')+'</span>';
 const arrow='<i class="go"></i>';
 const content=l.image?'<img class="branch-photo" src="'+l.image+'" alt="'+t(l.title)+'" loading="lazy"><span class="branch-info">'+icon+text+arrow+'</span>':icon+text+arrow;
 return '<a class="link'+(l.image?' branch':'')+'" href="'+l.url+'" target="_blank" rel="noopener">'+content+'</a>';
}
function render(){
 const r=document.documentElement;r.lang=L;r.dir=L==='ar'?'rtl':'ltr';
 $('lang').textContent=L==='ar'?'EN':'عربي';
 const c=S.colors||{};for(const k in c)r.style.setProperty('--'+k,c[k]);
 $('logo').src=S.logo;$('logo').alt=S.name;
 if(S.background){document.body.classList.add('hasbg');document.body.style.setProperty('--page-background-image','url("'+S.background+'")')}
 $('about').innerHTML=t(S.tagline)+'<small>'+t(S.about)+'</small>';
 $('sections').innerHTML=S.sections.map(s=>'<section class="link-section"><h2>'+t(s.title)+'</h2><div class="link-grid'+(s.links.some(l=>l.image)?' branches':'')+'">'+s.links.map(renderLink).join('')+'</div></section>').join('');
 $('foot').textContent='© '+new Date().getFullYear()+' '+S.name;
 document.title=S.name+' – '+t(S.tagline);
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('mf-lang',L)}catch(e){}render()};
try{render()}catch(e){console.error(e)}
</script>
</body>
</html>
